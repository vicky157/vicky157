      <ellipse cx="83.5" cy="87.5" rx="4.4" ry="3.6"/><ellipse cx="76.8" cy="81.5" rx="2" ry="2.4"/><ellipse cx="83.5" cy="78.8" rx="2" ry="2.4"/><ellipse cx="90.2" cy="81.5" rx="2" ry="2.4"/>
