<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vikash Singh</title>
  <desc id="desc">PhD student and AI researcher making LLM reasoning formally verifiable</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#1D1D22" stroke-width="1"/>
    </pattern>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4169E1"/>
      <stop offset="1" stop-color="#7B96FF"/>
    </linearGradient>
    <style>
      .cursor { animation: blink 1.1s steps(2, end) infinite; }
      .dog-bob { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .status-dot { animation: pulse 1.8s ease-in-out infinite; }
      .spark { animation: twinkle 2.4s ease-in-out infinite; }
      .spark-late { animation-delay: 1.2s; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes bob { 50% { transform: translateY(-4px); } }
      @keyframes pulse { 50% { opacity: .35; } }
      @keyframes twinkle { 50% { opacity: .2; transform: scale(.75); } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .dog-bob, .status-dot, .spark { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="338" rx="7" fill="#0D0D0F" stroke="#34343B" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="336" rx="6" fill="url(#grid)"/>

  <circle cx="28" cy="25" r="5" fill="#4169E1"/>
  <circle cx="46" cy="25" r="5" fill="#34343B"/>
  <circle cx="64" cy="25" r="5" fill="#34343B"/>
  <path d="M1 48H999" stroke="#34343B"/>
  <text x="82" y="30" fill="#777781" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" letter-spacing="2">~/VIKASH/RESEARCH-LAB</text>

  <text x="62" y="93" fill="#7B96FF" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16">~ $ whoami</text>
  <text x="60" y="159" fill="#FFFFFF" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="54" font-weight="700" letter-spacing="3">VIKASH SINGH</text>
  <text x="62" y="196" fill="#A4A4AE" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" letter-spacing="1.4">PHD STUDENT  ·  AI RESEARCHER  ·  FORMAL REASONING</text>
  <rect x="62" y="220" width="670" height="2" fill="url(#blueLine)"/>
  <text x="62" y="252" fill="#7B96FF" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" letter-spacing="1.2">IF THE MODEL SAYS “TRUST ME,” I ASK FOR A PROOF.</text>
  <rect class="cursor" x="499" y="239" width="8" height="18" fill="#7B96FF" opacity="0.9"/>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" font-weight="700">
    <rect x="62" y="280" width="92" height="32" rx="5" fill="#4169E1" fill-opacity="0.14" stroke="#4169E1"/>
    <text x="108" y="301" fill="#EDEDED" text-anchor="middle">LLM</text>
    <text x="171" y="301" fill="#777781">→</text>
    <rect x="194" y="280" width="118" height="32" rx="5" fill="#4169E1" fill-opacity="0.08" stroke="#34343B"/>
    <text x="253" y="301" fill="#EDEDED" text-anchor="middle">FORMALIZE</text>
    <text x="329" y="301" fill="#777781">→</text>
    <rect x="352" y="280" width="92" height="32" rx="5" fill="#4169E1" fill-opacity="0.08" stroke="#34343B"/>
    <text x="398" y="301" fill="#EDEDED" text-anchor="middle">SOLVE</text>
    <text x="461" y="301" fill="#777781">→</text>
    <rect x="484" y="280" width="118" height="32" rx="5" fill="#4169E1" fill-opacity="0.18" stroke="#7B96FF"/>
    <text x="543" y="301" fill="#7B96FF" text-anchor="middle">PROOF ✓</text>
  </g>

  <g>
    <rect x="760" y="280" width="178" height="32" rx="16" fill="#151519" stroke="#34343B"/>
    <circle class="status-dot" cx="780" cy="296" r="4" fill="#7B96FF"/>
    <text x="793" y="300" fill="#A4A4AE" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10" letter-spacing="1">STATUS: VERIFYING</text>
  </g>

  <g class="spark" transform="translate(946 65)">
    <path d="M0 -7V7M-7 0H7" stroke="#7B96FF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="spark spark-late" transform="translate(786 109) scale(.7)">
    <path d="M0 -7V7M-7 0H7" stroke="#4169E1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g>
