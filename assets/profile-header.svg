    <path d="M852 93L862 102L859 91" fill="#151519" stroke="#4169E1" stroke-linejoin="round"/>
    <text x="810" y="82" fill="#7B96FF" text-anchor="middle" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10" font-weight="700">PROOF FOUND! ✓</text>
  </g>

